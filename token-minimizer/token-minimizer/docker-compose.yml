version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: token-minimizer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to enable GPU acceleration (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build: ./backend
    container_name: token-minimizer-backend
    environment:
      - OLLAMA_HOST=http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    container_name: token-minimizer-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ollama_data:
